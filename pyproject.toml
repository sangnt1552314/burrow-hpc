[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hpit"
version = "0.1.0"
description = "Terminal and web dashboard for HPC clusters"
requires-python = ">=3.9"
dependencies = [
    "textual==8.2.8",
]

[project.scripts]
hpit = "hpit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpit = ["tui/*.tcss"]
